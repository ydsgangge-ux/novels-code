name: CI

# The point of this workflow is the loop it closes: a change to the agent loop,
# a tool schema, or a permission rule cannot land unless the golden paths still
# pass on both platforms. Before it existed, the only test that mattered ran on
# the author's machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests desktop

      - name: Test
        run: python -m pytest -q --cov --cov-report=term-missing

      # Snapshots are generated on first run, so the suite can pass locally with
      # a stale (or missing) snapshot. CI must notice: a dirty snapshot dir means
      # someone changed behaviour without committing the new expectation.
      - name: Snapshots committed
        if: runner.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: git diff --exit-code -- tests/snapshots
