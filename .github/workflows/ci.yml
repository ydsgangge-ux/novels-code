name: CI

# The point of this workflow is the loop it closes: a change to the agent loop,
# a tool schema, or a permission rule cannot land unless the golden paths still
# pass on both platforms. Before it existed, the only test that mattered ran on
# the author's machine.
#
# Two things made the old version hollow:
#   1. it installed `.[dev]` only, so every GUI test skipped (no PyQt6) and every
#      office test skipped (no python-docx/openpyxl/python-pptx) — a green run
#      proved nothing about the parts that actually broke in the field;
#   2. `if: runner.os == 'ubuntu-latest'` never matches (runner.os is `Linux`),
#      so the snapshot gate silently never ran.
# Both are fixed here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # GUI 测试已经在子进程里设 QT_QPA_PLATFORM=offscreen，但 import PyQt6 时
      # 仍要这几个系统库；缺了就是 "libEGL.so.1: cannot open shared object file"。
      - name: Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      # MCP 集成测试会起一个真实的 stdio server（tests/fixtures/*.mjs）。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,office,gui]"

      - name: Lint
        run: python -m ruff check src tests desktop

      - name: Test
        run: python -m pytest -q --cov --cov-report=term-missing

      # Snapshots are generated on first run, so the suite can pass locally with
      # a stale (or missing) snapshot. CI must notice: a dirty snapshot dir means
      # someone changed behaviour without committing the new expectation.
      - name: Snapshots committed
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: git diff --exit-code -- tests/snapshots
