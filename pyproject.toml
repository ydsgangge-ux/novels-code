[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gangge-code"
version = "0.1.0"
description = "AI Coding Assistant — 5-Layer Architecture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "ydsgangge-ux" },
]
keywords = ["ai", "coding-assistant", "agent", "llm", "deepseek", "claude", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "textual>=0.80.0",
    "rich>=13.9.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.10.0",
    "watchdog>=5.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    # Tool arguments are validated against each tool's JSON Schema before the
    # tool body runs (layer3_agent/tools/validation.py).
    "jsonschema>=4.18",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6.0",
]
web = [
    "playwright>=1.45.0",
]
# demo_video: narration (edge-tts), frame capture (playwright), muxing
# (imageio-ffmpeg ships an ffmpeg binary, so no system install is required).
video = [
    "playwright>=1.45.0",
    "edge-tts>=7.3.0",
    "imageio-ffmpeg>=0.5.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7.0",
]
all = [
    "gangge-code[gui,web,video,dev]",
]

[project.scripts]
gangge = "gangge.cli:main"

[project.urls]
Homepage = "https://github.com/ydsgangge-ux/gangge-code"
Repository = "https://github.com/ydsgangge-ux/gangge-code"
Issues = "https://github.com/ydsgangge-ux/gangge-code/issues"

[tool.setuptools.packages.find]
where = ["src"]

# Profiles, bundles and the permission policy are data, not modules — they must
# ship with the wheel.
[tool.setuptools.package-data]
"gangge.runtime" = ["profiles/*.yml", "bundles/*.yml"]
"gangge.layer4_permission" = ["*.yml"]
# 技能「效果」页签用的静态预览图，缺了面板会退化成一句说明
"gangge.layer4_tools.storyboard" = ["previews/*.png"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# CI enforces a *correctness* baseline, not a style preference. These rules only
# catch things that are broken at runtime: syntax that newer Pythons accept and
# 3.11 rejects, undefined names, dead imports. The style backlog (E501, E741,
# E70x, unused imports in legacy modules) is a separate cleanup; turning it on
# today would mean a red CI on day one, which teaches people to ignore CI.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every tmp_path here holds a .gangge dir plus a shadow git repo (~120 files),
# so the default "keep the last 3 sessions" accumulates thousands of files in
# %TEMP% and turns pytest's own exit cleanup into a bulk delete. Keep only the
# directories of *failed* tests; passing runs leave nothing behind.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.coverage.run]
source = ["src/gangge"]
branch = true

[tool.coverage.report]
# A floor, not a goal. It exists to catch a change that deletes more tests than
# code, which is the usual way coverage silently rots. Current baseline is ~31%,
# so the floor sits below it deliberately: a threshold set *at* the current value
# turns every refactor into a coverage argument instead of a correctness one.
fail_under = 25
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
