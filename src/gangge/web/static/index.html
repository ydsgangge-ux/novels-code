<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gangge Web</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --panel-2: #1d2129;
    --panel-3: #242930;
    --border: #2a2f38;
    --border-soft: #21252c;
    --text: #d6dbe3;
    --text-dim: #9aa4b2;
    --muted: #6e7681;
    --accent: #4f8cff;
    --accent-dim: #2b4f91;
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --think: #8b949e;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  button { font-family: inherit; }

  /* ══ Sidebar ══ */
  #sidebar {
    width: 244px; flex: 0 0 244px; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: width .15s ease, flex-basis .15s ease;
  }
  body.collapsed #sidebar { width: 56px; flex-basis: 56px; }
  body.collapsed .hide-when-collapsed { display: none; }
  #brand {
    height: 48px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-bottom: 1px solid var(--border-soft);
    font-weight: 600; letter-spacing: .2px; flex: 0 0 48px;
  }
  #brand .logo { color: var(--accent); font-size: 16px; }
  #collapse {
    margin-left: auto; background: transparent; border: 0; color: var(--muted);
    cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 4px;
  }
  #collapse:hover { background: var(--panel-3); color: var(--text); }
  #new-session {
    margin: 10px 12px; padding: 8px 12px; border-radius: 7px; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 6px; justify-content: center;
  }
  #new-session:hover { filter: brightness(1.12); }
  #session-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .group-label {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .6px; padding: 12px 8px 6px; font-weight: 600;
  }
  .session-item {
    padding: 8px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 2px;
    border: 1px solid transparent; display: flex; align-items: center; gap: 8px;
  }
  .session-item:hover { background: var(--panel-2); }
  .session-item.active { background: var(--panel-2); border-color: var(--border); }
  .session-item .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; background: var(--muted); }
  /* 四种状态和标签灯保持一致：绿=在跑、黄=等你、红=没做成、灰=空闲。
     以前 idle 画成绿色常亮，看起来跟"还在跑"没区别。 */
  .session-item .dot.running { background: var(--ok); animation: pulse 1.1s infinite; }
  .session-item .dot.attention { background: var(--warn); animation: pulse 1.1s infinite; }
  .session-item .dot.failed { background: var(--err); }
  .session-item .dot.error { background: var(--err); }
  .session-item .dot.idle { background: var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .session-item .meta { min-width: 0; flex: 1; }
  .session-item .name {
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-item .path {
    font-size: 11px; color: var(--muted); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left;
  }
  .session-item .kill {
    opacity: 0; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 14px; padding: 0 2px;
  }
  .session-item:hover .kill { opacity: 1; }
  .session-item .kill:hover { color: var(--err); }

  /* ══ Center ══ */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    height: 48px; flex: 0 0 48px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
  }
  #topbar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar .pills { display: flex; gap: 6px; align-items: center; }
  .pill {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    background: var(--panel-2); border: 1px solid var(--border-soft);
    padding: 2px 8px; border-radius: 20px; white-space: nowrap;
  }
  .pill.live { color: var(--warn); border-color: #3d3320; background: #241f14; }
  #topbar .spacer { flex: 1; }
  #stop {
    background: transparent; color: var(--err); border: 1px solid var(--err);
    border-radius: 7px; padding: 5px 14px; cursor: pointer; font-size: 13px;
  }
  #stop:disabled { opacity: .3; border-color: var(--border); color: var(--muted); cursor: default; }

  #panes { flex: 1; position: relative; overflow: hidden; }
  .pane { position: absolute; inset: 0; display: none; flex-direction: column; }
  .pane.active { display: flex; }

  .stream {
    flex: 1; overflow-y: auto; padding: 18px 0 8px;
  }
  .stream-inner { max-width: 900px; margin: 0 auto; padding: 0 24px; }

  /* message blocks */
  .m-user {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin: 6px 0 14px;
    white-space: pre-wrap; word-break: break-word; font-size: 14px;
  }
  .m-user::before {
    content: "你"; display: block; font-size: 11px; color: var(--accent);
    font-weight: 600; margin-bottom: 4px;
  }
  .m-att {
    font-size: 12px; color: var(--muted); margin: -8px 0 14px 4px;
    word-break: break-all;
  }
  .m-text {
    white-space: pre-wrap; word-break: break-word; line-height: 1.62;
    margin: 4px 0 10px; font-size: 14px;
  }
  .m-text.streaming::after {
    content: "▊"; color: var(--accent); animation: blink 1s steps(2) infinite; margin-left: 1px;
  }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

  details.m-think {
    margin: 6px 0 10px; border-left: 2px solid var(--border);
    padding-left: 10px; color: var(--think); font-size: 13px;
  }
  details.m-think > summary {
    cursor: pointer; color: var(--muted); font-size: 12px; list-style: none;
    user-select: none; font-style: italic;
  }
  details.m-think > summary::-webkit-details-marker { display: none; }
  details.m-think > summary::before { content: "▸ "; }
  details.m-think[open] > summary::before { content: "▾ "; }
  details.m-think .body {
    white-space: pre-wrap; word-break: break-word; margin-top: 6px;
    line-height: 1.55; max-height: 420px; overflow-y: auto;
  }

  details.m-tool {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    margin: 6px 0; overflow: hidden;
  }
  details.m-tool > summary {
    cursor: pointer; padding: 7px 11px; display: flex; align-items: center;
    gap: 8px; font-size: 12.5px; list-style: none; user-select: none;
  }
  details.m-tool > summary::-webkit-details-marker { display: none; }
  details.m-tool > summary:hover { background: var(--panel-2); }
  details.m-tool .icon { flex: 0 0 auto; }
  details.m-tool .tname { font-family: var(--mono); color: var(--accent); font-weight: 500; }
  details.m-tool .tsum {
    color: var(--text-dim); font-family: var(--mono); font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  details.m-tool .tms { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  details.m-tool .status { flex: 0 0 auto; font-size: 12px; }
  details.m-tool .status.ok { color: var(--ok); }
  details.m-tool .status.err { color: var(--err); }
  details.m-tool .status.run { color: var(--warn); }
  details.m-tool .sect { border-top: 1px solid var(--border-soft); padding: 8px 11px; }
  details.m-tool .sect h5 {
    margin: 0 0 5px; font-size: 10.5px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
  }
  details.m-tool pre {
    margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto;
    color: var(--text-dim);
  }
  details.m-tool pre.err { color: #ffb4ae; }

  .m-sys { color: var(--muted); font-size: 12.5px; margin: 4px 0; font-style: italic; }
  .m-err {
    color: #ffb4ae; background: #2a1518; border: 1px solid #4a2226;
    border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 13px;
    white-space: pre-wrap;
  }
  .m-done {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 12px 0 6px; padding: 8px 12px; border-radius: 8px;
    background: #14251a; border: 1px solid #1f3a28; font-size: 12.5px; color: #9fdcb0;
  }
  .m-done.warn { background: #241f14; border-color: #3d3320; color: #e3c07a; }
  .m-done code { font-family: var(--mono); font-size: 11.5px; opacity: .85; }

  /* composer */
  .composer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 24px 12px; }
  .composer-inner { max-width: 900px; margin: 0 auto; }
  .composer textarea {
    width: 100%; resize: none; min-height: 52px; max-height: 220px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 13px; font-family: inherit; font-size: 14px;
    outline: none; line-height: 1.5;
  }
  .composer textarea:focus { border-color: var(--accent-dim); }
  .composer-row {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
  }
  /* 附件 */
  .composer .attach {
    background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .composer .attach:hover { color: var(--text); border-color: var(--accent-dim); }
  .composer.dragover { outline: 2px dashed var(--accent-dim); outline-offset: -6px; border-radius: 10px; }
  .attach-bar { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .attach-bar.show { display: flex; }
  .att-chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 260px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px;
    padding: 3px 9px; font-size: 11.5px; color: var(--text-dim);
  }
  .att-chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att-chip.busy { border-style: dashed; }
  .att-chip button {
    background: transparent; border: 0; color: var(--muted); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0;
  }
  .att-chip button:hover { color: var(--err); }
  .composer-row .hint { font-size: 11.5px; color: var(--muted); }
  .composer-row .spacer { flex: 1; }
  #send {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 20px; cursor: pointer; font-size: 13.5px; font-weight: 500;
  }
  #send:disabled { opacity: .35; cursor: default; }
  .toggle {
    display: flex; align-items: center; gap: 5px; font-size: 12px;
    color: var(--text-dim); cursor: pointer; user-select: none;
  }
  .toggle input { accent-color: var(--accent); }

  /* ══ Right rail ══ */
  #rail {
    width: 268px; flex: 0 0 268px; border-left: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column;
  }
  #rail .tabs {
    display: flex; border-bottom: 1px solid var(--border-soft); flex: 0 0 auto;
  }
  #rail .tab {
    flex: 1; padding: 9px 6px; text-align: center; font-size: 12px; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent;
  }
  #rail .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  #rail .body { flex: 1; overflow-y: auto; padding: 12px; font-size: 12.5px; }
  .stat-row {
    display: flex; justify-content: space-between; padding: 5px 0;
    border-bottom: 1px solid var(--border-soft); font-size: 12px;
  }
  .stat-row span:first-child { color: var(--muted); }
  .stat-row span:last-child { font-family: var(--mono); }
  .todo-item { display: flex; gap: 7px; padding: 5px 0; line-height: 1.45; }
  .todo-item.done { color: var(--muted); text-decoration: line-through; }
  .todo-item.active { color: var(--text); }
  .todo-item.active .mark { color: var(--accent); }
  .rail-empty { color: var(--muted); font-size: 12px; padding: 8px 0; }

  /* ══ Modal ══ */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(2px);
  }
  #modal.show { display: flex; }
  #modal .box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 22px; width: min(600px, 92vw); box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  #modal .box h3 { margin: 0 0 6px; font-size: 15px; }
  #modal .box p { margin: 0 0 16px; color: var(--text-dim); white-space: pre-wrap; font-size: 13px; line-height: 1.6; max-height: 300px; overflow-y: auto; }
  #modal .box textarea {
    width: 100%; min-height: 76px; margin-bottom: 16px; background: var(--panel-2);
    color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px;
    font-family: inherit; font-size: 13.5px; resize: vertical; outline: none;
  }
  #modal .row { display: flex; gap: 10px; justify-content: flex-end; }
  #modal button {
    border-radius: 7px; padding: 7px 16px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  }
  #modal button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #modal button.danger { background: transparent; border-color: var(--err); color: var(--err); }

  /* ── File browser ── */
  .crumbs {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 4px 0 8px; display: flex; gap: 3px; flex-wrap: wrap; align-items: center;
  }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .fentry {
    display: flex; align-items: center; gap: 7px; padding: 4px 6px;
    border-radius: 5px; cursor: pointer; font-family: var(--mono); font-size: 12px;
  }
  .fentry:hover { background: var(--panel-2); }
  .fentry .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fentry .fsize { color: var(--muted); font-size: 10.5px; flex: 0 0 auto; }
  .fentry.dir .fname { color: var(--text); }
  .fentry.file .fname { color: var(--text-dim); }
  .fpreview {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; color: var(--text-dim);
    background: var(--bg); border: 1px solid var(--border-soft);
    border-radius: 6px; padding: 8px; margin-top: 6px; max-height: 60vh; overflow: auto;
  }
  .fhead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .fhead .back {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 11px;
  }
  .fhead .fpath { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .fhead .open-sys, .fhead .open-tab {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 11px; white-space: nowrap;
  }
  .fhead .open-sys:hover, .fhead .open-tab:hover { color: var(--text); border-color: var(--accent); }

  /* ── Pricing editor ── */
  .p-input {
    width: 100%; margin-bottom: 6px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
    font-family: var(--mono); font-size: 11.5px; outline: none;
  }
  .p-input:focus { border-color: var(--accent-dim); }
  #p-save, #p-fill {
    width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 7px; cursor: pointer; font-size: 12.5px; margin-top: 2px;
  }
  #p-save:hover, #p-fill:hover { filter: brightness(1.1); }
  #p-fill {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
  }

  /* ── Model select ── */
  .model-select, .provider-select {
    background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 6px; font-size: 11.5px; max-width: 180px; outline: none;
  }
  .provider-select { max-width: 110px; }

  /* ── History group ── */
  .hist-item {
    padding: 6px 9px; border-radius: 6px; cursor: pointer; margin-bottom: 1px;
    font-size: 12.5px; display: flex; align-items: center; gap: 7px;
  }
  .hist-item:hover { background: var(--panel-2); }
  .hist-item .hname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
  .hist-item .hopen {
    font-size: 10.5px; color: var(--muted); font-family: var(--mono); flex: 0 0 auto;
  }

  /* empty state */
  .empty-state {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; color: var(--muted); font-size: 13.5px;
  }
  .empty-state .big { font-size: 30px; opacity: .5; }
</style>
</head>
<body>

<aside id="sidebar">
  <div id="brand">
    <span class="logo">◈</span>
    <span class="hide-when-collapsed">Gangge</span>
    <button id="collapse" title="收起/展开">≡</button>
  </div>
  <button id="new-session"><span>＋</span><span class="hide-when-collapsed">新建任务</span></button>
  <div id="session-list"></div>
</aside>

<div id="main">
  <div id="topbar">
    <span class="title" id="title">未选择任务</span>
    <div class="pills" id="pills"></div>
    <span class="spacer"></span>
    <button id="stop" disabled>■ 停止</button>
  </div>
  <div id="panes">
    <div class="empty-state" id="empty-state">
      <div class="big">◈</div>
      <div>点左上角「新建任务」开始</div>
      <div style="font-size:12px">每个任务独立运行，可以同时开多个</div>
    </div>
  </div>
</div>

<aside id="rail">
  <div class="tabs">
    <div class="tab active" data-tab="todo">清单</div>
    <div class="tab" data-tab="stats">统计</div>
    <div class="tab" data-tab="files">文件</div>
    <div class="tab" data-tab="pricing">价格</div>
  </div>
  <div class="body" id="rail-body"></div>
</aside>

<div id="modal">
  <div class="box">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <textarea id="modal-input" style="display:none"></textarea>
    <div class="row">
      <button id="modal-cancel">取消</button>
      <button id="modal-always" style="display:none">本次会话总是允许</button>
      <button id="modal-ok" class="primary">确定</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════ */
const sessions = new Map();
let activeId = null;
let railTab = "todo";
let MODEL_INFO = { current: "", current_provider: "", options: [], providers: [] };

// 厂商目录来自后端 /api/models：每家厂商的模型各不相同，切厂商要重填模型下拉。
function providerSpec(id) {
  return (MODEL_INFO.providers || []).find(p => p.id === id) || null;
}
function fillProviderSelect(sel, selected) {
  const list = MODEL_INFO.providers || [];
  sel.innerHTML = list.map(p =>
    `<option value="${escapeHtml(p.id)}"${p.id === selected ? " selected" : ""}${p.configured === false ? " disabled" : ""}>${escapeHtml(p.label)}${p.configured === false ? "（未配置）" : ""}</option>`
  ).join("") || `<option value="">默认厂商</option>`;
}
function fillModelSelect(sel, providerId, selected) {
  const spec = providerSpec(providerId);
  const models = spec ? (spec.models || []) : [];
  sel.innerHTML = models.length
    ? models.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("")
    : `<option value="">默认模型</option>`;
  const want = selected || (spec && spec.default_model) || "";
  if (want && [...sel.options].some(o => o.value === want)) sel.value = want;
}

const $ = (id) => document.getElementById(id);

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

function escapeHtml(text) {
  return String(text ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtMs(ms) {
  if (!ms) return "";
  if (ms < 1000) return ms + "ms";
  if (ms < 60000) return (ms / 1000).toFixed(1) + "s";
  const m = Math.floor(ms / 60000);
  const s = Math.round((ms % 60000) / 1000);
  return `${m}m${s}s`;
}

function fmtNum(n) {
  if (!n) return "0";
  if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
  if (n >= 1000) return (n / 1000).toFixed(1) + "k";
  return String(n);
}

function fmtSize(bytes) {
  if (!bytes) return "";
  if (bytes < 1024) return bytes + "B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + "K";
  return (bytes / 1048576).toFixed(1) + "M";
}

function shortPath(p) {
  if (!p) return "(未指定工作目录)";
  const parts = p.split(/[\\/]/).filter(Boolean);
  return parts.length <= 2 ? p : "…/" + parts.slice(-2).join("/");
}

/* ═══════════════════════════════════════════════════════════
   File browser (right rail, 文件 tab)
   ═══════════════════════════════════════════════════════════ */
async function renderFiles(s) {
  const body = $("rail-body");
  if (!s.workspace) { body.innerHTML = `<div class="rail-empty">这个会话没有工作目录</div>`; return; }

  /* 预览单个文件 */
  if (s.viewing) {
    body.innerHTML =
      `<div class="fhead"><button class="back">← 返回</button>` +
      `<span class="fpath">${escapeHtml(s.viewing)}</span>` +
      `<button class="open-sys" title="用运行 Web 服务的这台机器的默认程序打开">系统打开</button>` +
      `<button class="open-tab" title="在浏览器新标签页查看原文件">浏览器打开</button></div>` +
      `<div class="fpreview">加载中…</div>`;
    body.querySelector(".back").onclick = () => { s.viewing = null; renderFiles(s); };
    const viewing = s.viewing;
    body.querySelector(".open-sys").onclick = async () => {
      try {
        await api(`/api/sessions/${s.id}/file/open`, {
          method: "POST", body: JSON.stringify({ path: viewing }),
        });
      } catch (e) {
        alert("打开失败：" + e.message);
      }
    };
    body.querySelector(".open-tab").onclick = () => {
      window.open(`/api/sessions/${s.id}/file/raw?path=${encodeURIComponent(viewing)}`, "_blank");
    };
    try {
      const data = await api(`/api/sessions/${s.id}/file?path=${encodeURIComponent(s.viewing)}`);
      const el = body.querySelector(".fpreview");
      if (el) {
        el.textContent = data.content || "(空文件)";
        if (data.truncated) el.textContent += "\n\n…（文件过大，已截断）";
      }
    } catch (e) {
      const el = body.querySelector(".fpreview");
      if (el) el.textContent = "读取失败：" + e.message;
    }
    return;
  }

  /* 目录列表 */
  const cur = s.filePath || "";
  const crumbs = cur.split("/").filter(Boolean);
  let head = `<div class="crumbs"><a data-p="">根目录</a>`;
  crumbs.forEach((c, i) => {
    head += ` / <a data-p="${escapeHtml(crumbs.slice(0, i + 1).join("/"))}">${escapeHtml(c)}</a>`;
  });
  head += `</div><div id="flist"><div class="rail-empty">加载中…</div></div>`;
  body.innerHTML = head;
  body.querySelectorAll(".crumbs a").forEach(a => {
    a.onclick = () => { s.filePath = a.dataset.p; renderFiles(s); };
  });

  try {
    const data = await api(`/api/sessions/${s.id}/files?path=${encodeURIComponent(cur)}`);
    const list = body.querySelector("#flist");
    if (!list) return;
    if (!data.entries.length) { list.innerHTML = `<div class="rail-empty">空目录</div>`; return; }
    list.innerHTML = data.entries.map(e => `
      <div class="fentry ${e.dir ? "dir" : "file"}" data-path="${escapeHtml(e.path)}" data-dir="${e.dir}">
        <span>${e.dir ? "📁" : "📄"}</span>
        <span class="fname">${escapeHtml(e.name)}</span>
        <span class="fsize">${e.dir ? "" : fmtSize(e.size)}</span>
      </div>`).join("");
    list.querySelectorAll(".fentry").forEach(el => {
      el.onclick = () => {
        if (el.dataset.dir === "true") { s.filePath = el.dataset.path; renderFiles(s); }
        else { s.viewing = el.dataset.path; renderFiles(s); }
      };
    });
  } catch (e) {
    const list = body.querySelector("#flist");
    if (list) list.innerHTML = `<div class="rail-empty">${escapeHtml(e.message)}</div>`;
  }
}

/* ═══════════════════════════════════════════════════════════
   Sessions
   ═══════════════════════════════════════════════════════════ */
async function createSession() {
  const workspace = prompt("项目名或工作目录（留空 = 自动新建沙箱；只写名字会放在 gangge_projects 下）", "");
  if (workspace === null) return;
  const name = prompt("任务名称（可留空）", "") || "";
  const s = await api("/api/sessions", {
    method: "POST",
    body: JSON.stringify({ workspace: workspace.trim(), name: name.trim() }),
  });
  mountSession(s);
  selectSession(s.id);
}

function mountSession(s) {
  const item = document.createElement("div");
  item.className = "session-item";
  item.dataset.id = s.id;
  item.innerHTML = `
    <span class="dot ${s.status}"></span>
    <div class="meta">
      <div class="name">${escapeHtml(s.name)}</div>
      <div class="path">${escapeHtml(s.workspace)}</div>
    </div>
    <button class="kill" title="删除">×</button>`;
  item.onclick = (e) => {
    if (e.target.classList.contains("kill")) { removeSession(s.id); return; }
    selectSession(s.id);
  };
  item.ondblclick = () => renameSession(s.id);
  $("session-list").appendChild(item);

  const pane = document.createElement("div");
  pane.className = "pane";
  pane.dataset.id = s.id;
  pane.innerHTML = `
    <div class="stream"><div class="stream-inner"></div></div>
    <div class="composer"><div class="composer-inner">
      <div class="attach-bar"></div>
      <textarea placeholder="描述任务…（Ctrl+Enter 发送，也可把文件拖进来）"></textarea>
      <div class="composer-row">
        <button class="attach" title="添加附件：Word / Excel / PPT / PDF / 图片 / 文本">📎</button>
        <input type="file" class="file-input" multiple hidden>
        <select class="provider-select" title="模型厂商"></select>
        <select class="model-select" title="本轮使用的模型"></select>
        <label class="toggle"><input type="checkbox" class="auto-allow"> 自动允许</label>
        <span class="hint">轮数 <input class="max-rounds" style="width:44px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;color:inherit;font-size:11.5px;padding:2px 4px" value="${s.max_rounds}"></span>
        <span class="hint" title="单次回复输出上限；0 或留空 = 用 .env 里的 MAX_TOKENS">输出 <input class="max-tokens" style="width:68px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;color:inherit;font-size:11.5px;padding:2px 4px" value="${s.max_tokens || 0}"></span>
        <span class="spacer"></span>
        <button class="send">发送</button>
      </div>
    </div></div>`;
  $("panes").appendChild(pane);

  const entry = {
    id: s.id, name: s.name, workspace: s.workspace, status: s.status || "idle",
    max_rounds: s.max_rounds || 50,
    max_tokens: s.max_tokens || 0,
    el: item, pane,
    stream: pane.querySelector(".stream"),
    inner: pane.querySelector(".stream-inner"),
    input: pane.querySelector("textarea"),
    send: pane.querySelector(".send"),
    autoAllow: pane.querySelector(".auto-allow"),
    maxRounds: pane.querySelector(".max-rounds"),
    maxTokens: pane.querySelector(".max-tokens"),
    modelSel: pane.querySelector(".model-select"),
    providerSel: pane.querySelector(".provider-select"),
    todos: [], stats: { input: 0, output: 0, rounds: 0, elapsed: 0, cost: "" },
    tools: new Map(),     // tool_call_id -> <details>
    lastText: null,
    // 刷新后还要能还原标签灯：这两个状态从服务端快照里取，不能一律当空闲
    running: s.status === "running",
    attention: Boolean(s.pending),
    outcome: "",          // "" | "ok" | "failed"
    attachments: [],      // 已上传、随下一条消息发出去
    uploading: 0,
    filePath: "", viewing: null,
  };
  const provId = s.provider || MODEL_INFO.current_provider || (MODEL_INFO.providers[0] || {}).id || "";
  fillProviderSelect(entry.providerSel, provId);
  fillModelSelect(entry.modelSel, provId, s.model || "");
  // 换厂商时模型清单要跟着换；同一家的模型名不通用
  entry.providerSel.onchange = () => fillModelSelect(entry.modelSel, entry.providerSel.value, "");
  // ── 附件：点按钮选、或直接把文件拖进输入区 ──
  const attachBtn = pane.querySelector(".attach");
  const fileInput = pane.querySelector(".file-input");
  const composer = pane.querySelector(".composer");
  entry.attachBar = pane.querySelector(".attach-bar");
  attachBtn.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    addFiles(s.id, [...fileInput.files]).finally(() => { fileInput.value = ""; });
  };
  composer.addEventListener("dragover", (e) => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
    e.preventDefault();
    composer.classList.add("dragover");
  });
  composer.addEventListener("dragleave", () => composer.classList.remove("dragover"));
  composer.addEventListener("drop", (e) => {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    composer.classList.remove("dragover");
    addFiles(s.id, [...e.dataTransfer.files]);
  });

  entry.send.onclick = () => sendMessage(s.id);
  entry.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMessage(s.id); }
  });
  entry.input.addEventListener("input", () => {
    entry.input.style.height = "auto";
    entry.input.style.height = Math.min(entry.input.scrollHeight, 220) + "px";
  });
  sessions.set(s.id, entry);
  connect(s.id);
  return entry;
}

function selectSession(id) {
  activeId = id;
  $("empty-state").style.display = "none";
  for (const [sid, s] of sessions) {
    s.pane.classList.toggle("active", sid === id);
    s.el.classList.toggle("active", sid === id);
  }
  const s = sessions.get(id);
  if (!s) return;
  $("title").textContent = s.name;
  renderPills();
  renderRail();
  refreshTabLight();   // 切换任务时按当前任务重算标签灯，别沿用上一个任务的灯
  s.input.focus();
}

async function renameSession(id) {
  const s = sessions.get(id);
  if (!s) return;
  const name = prompt("重命名任务", s.name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed || trimmed === s.name) return;
  try {
    const snap = await api(`/api/sessions/${id}/rename`, {
      method: "POST", body: JSON.stringify({ name: trimmed }),
    });
    s.name = snap.name;
    s.el.querySelector(".name").textContent = snap.name;
    if (activeId === id) $("title").textContent = snap.name;
  } catch (e) { alert(e.message); }
}

/* ═══════════════════════════════════════════════════════════
   历史会话（磁盘上的，含桌面端产生的）
   ═══════════════════════════════════════════════════════════ */
async function refreshHistory() {
  let rows = [];
  try { rows = (await api("/api/history")).sessions || []; } catch (e) { return; }

  const known = new Set(sessions.keys());
  const pending = rows.filter(r => !known.has(r.id)).slice(0, 40);
  const old = $("hist-group");
  if (old) old.remove();
  if (!pending.length) return;

  const byWs = new Map();
  for (const r of pending) {
    const key = r.workspace || "";
    if (!byWs.has(key)) byWs.set(key, []);
    byWs.get(key).push(r);
  }

  const group = document.createElement("div");
  group.id = "hist-group";
  let html = `<div class="group-label">历史会话</div>`;
  for (const [ws, items] of byWs) {
    html += `<div class="group-label" style="padding-left:8px;text-transform:none;letter-spacing:0;font-size:10.5px">${escapeHtml(shortPath(ws))}</div>`;
    html += items.map(r => {
      // 桌面端默认标题是"新会话"，一堆同名条目没有信息量，改用目录名兜底。
      const label = (!r.title || r.title === "新会话")
        ? shortPath(r.workspace) : r.title;
      return `<div class="hist-item" data-id="${escapeHtml(r.id)}" title="${escapeHtml(r.workspace || "")}">
         <span class="hname">${escapeHtml(label)}</span>
         <span class="hopen">打开</span>
       </div>`;
    }).join("");
  }
  group.innerHTML = html;
  $("session-list").appendChild(group);
  group.querySelectorAll(".hist-item").forEach(el => {
    el.onclick = () => openHistory(el.dataset.id);
  });
}

async function openHistory(id) {
  try {
    const snap = await api("/api/sessions/open", {
      method: "POST", body: JSON.stringify({ id }),
    });
    if (!sessions.has(snap.id)) mountSession(snap);
    selectSession(snap.id);
    refreshHistory();
  } catch (e) { alert("打开失败：" + e.message); }
}

async function removeSession(id) {
  if (!confirm("删除这个任务？（不影响磁盘文件）")) return;
  try { await api(`/api/sessions/${id}`, { method: "DELETE" }); } catch (e) {}
  const s = sessions.get(id);
  if (s) { try { s.es && s.es.close(); } catch (e) {} s.pane.remove(); s.el.remove(); sessions.delete(id); refreshTabLight(); }
  if (activeId === id) {
    activeId = null;
    const next = sessions.keys().next();
    if (!next.done) selectSession(next.value);
    else { $("title").textContent = "未选择任务"; $("empty-state").style.display = "flex"; renderPills(); renderRail(); }
  }
}

/* ═══════════════════════════════════════════════════════════
   Streaming
   ═══════════════════════════════════════════════════════════ */
function connect(id) {
  const s = sessions.get(id);
  if (!s) return;
  const es = new EventSource(`/api/sessions/${id}/events`);
  s.es = es;
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch (err) { return; }
    if (ev.type === "hello") { loadHistory(id); return; }
    handle(id, ev);
  };
}

async function loadHistory(id) {
  try {
    const { events } = await api(`/api/sessions/${id}/history`);
    const s = sessions.get(id);
    if (!s || !events || !events.length || s.inner.childElementCount) return;
    events.forEach(ev => handle(id, ev, true));
  } catch (e) {}
}

function handle(id, ev, replay = false) {
  const s = sessions.get(id);
  if (!s) return;
  const box = s.inner;
  const scroll = () => { if (state_nearBottom(s) || replay) s.stream.scrollTop = s.stream.scrollHeight; };

  switch (ev.type) {
    case "user": {
      s.lastText = null;
      const u = document.createElement("div");
      u.className = "m-user";
      u.textContent = ev.text;
      box.appendChild(u);
      break;
    }

    case "attachments": {
      // 紧跟用户气泡：刷新后回放也能看到这一轮挂了哪些文件
      const items = ev.items || [];
      if (!items.length) break;
      const a = document.createElement("div");
      a.className = "m-att";
      a.textContent = "📎 " + items.map(i => i.icon ? `${i.icon} ${i.name}` : i.name).join("　");
      box.appendChild(a);
      break;
    }

    case "text": {
      /* 流式合并：连续 text 累积到同一个块，避免每个 token 一个 div */
      if (!s.lastText) {
        s.lastText = document.createElement("div");
        s.lastText.className = "m-text streaming";
        box.appendChild(s.lastText);
      }
      s.lastText.textContent += ev.text;
      break;
    }

    case "thinking": {
      s.lastText = null;
      const d = document.createElement("details");
      d.className = "m-think";
      d.innerHTML = `<summary>思考过程</summary><div class="body"></div>`;
      d.querySelector(".body").textContent = ev.text;
      box.appendChild(d);
      break;
    }

    case "tool": {
      s.lastText = null;
      const card = buildToolCard(ev);
      box.appendChild(card);
      s.tools.set(ev.id || ("t" + Math.random()), card);
      break;
    }

    case "tool_result": {
      const card = s.tools.get(ev.id);
      if (card) fillToolCard(card, ev);
      else {
        const orphan = buildToolCard({ id: ev.id, name: ev.name, input: "" });
        fillToolCard(orphan, ev);
        box.appendChild(orphan);
      }
      break;
    }

    case "status_msg": {
      const d = document.createElement("div");
      d.className = "m-sys";
      d.textContent = ev.text;
      box.appendChild(d);
      break;
    }

    case "question":
      s.attention = true;
      refreshTabLight();
      if (!replay) askModal(id, "需要你的回答", ev.text, true);
      break;

    case "permission":
      s.attention = true;
      refreshTabLight();
      if (!replay) askModal(id, `需要授权：${ev.tool || ""}`, ev.text, false);
      break;

    case "todos":
      s.todos = ev.todos || [];
      if (activeId === id) renderRail();
      break;

    case "done": {
      s.lastText = null;
      s.running = false;
      const tokens = ev.tokens || {};
      s.stats.input += tokens.input || 0;
      s.stats.output += tokens.output || 0;
      s.stats.rounds += ev.rounds || 0;
      s.stats.elapsed += ev.elapsed_ms || 0;
      if (ev.cost) s.stats.cost = ev.cost;

      // 只有明确"做完了"的原因才算成功。以前这里是黑名单，结果 loop 里
      // llm_error / llm_timeout 这些真失败漏在名单外，被打上 ✓ 还不点红灯。
      // 换成白名单：以后新增的 reason 默认按未完成处理。
      const ok = OK_REASONS.includes(ev.reason);
      // 只有这次页面打开后真实发生的结束才点灯。回放的是历史结果 ——
      // 昨天有个任务没跑完，不该让标签灯永远红着。
      if (!replay) s.outcome = ok ? "ok" : "failed";
      const d = document.createElement("div");
      d.className = "m-done" + (ok ? "" : " warn");
      d.innerHTML =
        `<span>${ok ? "✓" : "⚠"}</span>` +
        `<span>${escapeHtml(reasonLabel(ev.reason))}</span>` +
        `<code>${ev.rounds || 0} 轮</code>` +
        `<code>${fmtMs(ev.elapsed_ms) || "—"}</code>` +
        `<code>${fmtNum((tokens.input || 0) + (tokens.output || 0))} tok</code>` +
        (ev.cost ? `<code>${escapeHtml(ev.cost)}</code>` : "");
      box.appendChild(d);
      updateStatus(id, "idle");
      break;
    }

    case "error": {
      s.lastText = null;
      if (!replay) s.outcome = "failed";
      const d = document.createElement("div");
      d.className = "m-err";
      d.textContent = ev.text;
      box.appendChild(d);
      updateStatus(id, "error");
      break;
    }

    case "queued": {
      const d = document.createElement("div");
      d.className = "m-sys";
      d.textContent = `⏳ 已排队（第 ${ev.position} 条）：${ev.text}`;
      box.appendChild(d);
      break;
    }

    case "renamed": {
      s.name = ev.name;
      const nameEl = s.el.querySelector(".name");
      if (nameEl) nameEl.textContent = ev.name;
      if (activeId === id) $("title").textContent = ev.name;
      break;
    }

    case "status":
      updateStatus(id, ev.status);
      break;
  }
  scroll();
}

function state_nearBottom(s) {
  const gap = s.stream.scrollHeight - s.stream.scrollTop - s.stream.clientHeight;
  return gap < 120;
}

//: 真正"把事情做完了"的结束原因。loop.py 里其余的（llm_error / llm_timeout /
//: max_rounds / idle_no_action / stalled_no_progress / consecutive_readonly /
//: cancelled）都算未完成。
const OK_REASONS = ["all_todos_done", "model_end_turn", "single_turn_answer", "qa_answer"];

function reasonLabel(reason) {
  const map = {
    all_todos_done: "全部待办已完成",
    model_end_turn: "模型结束本轮",
    single_turn_answer: "单轮回答",
    max_rounds: "达到轮数上限",
    idle_no_action: "模型连续没有执行动作",
    stalled: "停滞收尾",
    stalled_no_progress: "停滞（没有新进展）",
    cancelled: "已取消",
    consecutive_readonly: "连续只读，已收手",
    llm_error: "模型接口报错",
    llm_timeout: "模型超时",
    qa_answer: "问答",
  };
  return map[reason] || (reason || "结束");
}

/* ── Tool cards ── */
function toolIcon(name) {
  if (/^(read_file|list_dir|glob|grep|find_)/.test(name)) return "🔍";
  if (/^(write_file|edit_file|apply_patch)/.test(name)) return "✏️";
  if (name === "bash") return "⌨️";
  if (name === "TodoWrite") return "📋";
  if (/^(office_|vision|browser)/.test(name)) return "🖼";
  if (/^(web_search|web_fetch|package_info)/.test(name)) return "🌐";
  if (name === "run_tests" || name === "lint_check") return "🧪";
  return "⚙";
}

function toolSummary(ev) {
  let input = {};
  try { input = JSON.parse(ev.input || "{}"); } catch (e) {}
  const pick = input.path || input.file_path || input.command || input.query
    || input.pattern || input.url || input.action || "";
  return String(pick).replace(/\s+/g, " ").slice(0, 120);
}

function buildToolCard(ev) {
  const d = document.createElement("details");
  d.className = "m-tool";
  d.dataset.id = ev.id || "";
  d.innerHTML = `
    <summary>
      <span class="icon">${toolIcon(ev.name || "")}</span>
      <span class="tname">${escapeHtml(ev.name || "tool")}</span>
      <span class="tsum">${escapeHtml(toolSummary(ev))}</span>
      <span class="tms"></span>
      <span class="status run">●</span>
    </summary>
    <div class="sect"><h5>参数</h5><pre class="args"></pre></div>
    <div class="sect out-sect" style="display:none"><h5>输出</h5><pre class="out"></pre></div>`;
  d.querySelector(".args").textContent = prettyJson(ev.input);
  return d;
}

function fillToolCard(card, ev) {
  const status = card.querySelector(".status");
  status.className = "status " + (ev.error ? "err" : "ok");
  status.textContent = ev.error ? "✗" : "✓";
  card.querySelector(".tms").textContent = fmtMs(ev.ms);
  card.querySelector(".out-sect").style.display = "";
  const out = card.querySelector(".out");
  out.textContent = ev.output || "(无输出)";
  if (ev.error) out.classList.add("err");
}

function prettyJson(raw) {
  if (!raw) return "(无参数)";
  try { return JSON.stringify(JSON.parse(raw), null, 2); } catch (e) { return raw; }
}

/* ── Status / pills ── */
function updateStatus(id, status) {
  const s = sessions.get(id);
  if (!s) return;
  s.status = status;
  s.running = status === "running";
  if (s.running) {
    // 新一轮开始：上一轮的"没做成"和"等你确认"都该翻篇
    s.outcome = "";
    s.attention = false;
  }
  if (status !== "running") {
    // 结束一轮：断开流式块，下一段文字起新块
    if (s.lastText) s.lastText.classList.remove("streaming");
  }
  if (activeId === id) {
    $("stop").disabled = !s.running;
    s.send.disabled = s.running;
    renderPills();
    renderRail();
  }
  refreshTabLight();
}

function renderPills() {
  const pills = $("pills");
  const s = activeId ? sessions.get(activeId) : null;
  if (!s) { pills.innerHTML = ""; return; }
  const total = s.stats.input + s.stats.output;
  const parts = [
    `<span class="pill">${escapeHtml(s.workspace.split(/[\\/]/).pop() || "")}</span>`,
  ];
  if (s.running) parts.push(`<span class="pill live">运行中</span>`);
  if (total) parts.push(`<span class="pill">${fmtNum(total)} tok</span>`);
  if (s.stats.elapsed) parts.push(`<span class="pill">${fmtMs(s.stats.elapsed)}</span>`);
  pills.innerHTML = parts.join("");
}

/* ═══════════════════════════════════════════════════════════
   标签页状态灯（favicon）
     无灯   = 当前任务空闲
     绿闪   = 当前任务正在跑
     黄灯   = 当前任务卡在等你回答/授权
     红灯   = 当前任务结束但没成（达到轮数上限 / 停滞 / 取消 / 报错）
   只看当前选中的任务：切到空闲任务时，不该还挂着别的任务的红灯。
   左栏小圆点仍按各自任务独立显示。
   ═══════════════════════════════════════════════════════════ */
const TAB_LIGHT = {
  running: "#3fb950",
  failed: "#f85149",
  attention: "#d29922",
};
let tabLightState = null;
let tabLightOn = true;
let tabLightTimer = null;
const tabLightCache = new Map();

function tabLightIcon(state, on) {
  const key = state + (on ? ":on" : ":off");
  const cached = tabLightCache.get(key);
  if (cached) return cached;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 32;
  if (on) {
    const g = canvas.getContext("2d");
    g.beginPath();
    g.arc(16, 16, 11, 0, Math.PI * 2);
    g.fillStyle = TAB_LIGHT[state] || "#8b949e";
    g.fill();
    // 深色描边：浅色标签栏上也得看得见，不然黄灯会糊掉
    g.lineWidth = 3;
    g.strokeStyle = "rgba(0,0,0,.45)";
    g.stroke();
  }
  const url = canvas.toDataURL("image/png");
  tabLightCache.set(key, url);
  return url;
}

const DEFAULT_TAB_ICON = "/logo.svg";

function applyTabLight() {
  let link = document.querySelector('link[rel="icon"]');
  if (!link) {
    link = document.createElement("link");
    link.rel = "icon";
    document.head.appendChild(link);
  }
  if (!tabLightState) {
    // 没任务时回到产品 LOGO。以前是直接删 <link>，浏览器会继续显示上一次
    // 的红灯图标，看起来像“灯没灭”，换回显式图标才稳。
    link.type = "image/svg+xml";
    link.href = DEFAULT_TAB_ICON;
    return;
  }
  link.type = "image/png";
  link.href = tabLightIcon(tabLightState, tabLightOn);
}

function setTabLight(state) {
  if (state === tabLightState) return;
  tabLightState = state;
  if (tabLightTimer) { clearInterval(tabLightTimer); tabLightTimer = null; }
  tabLightOn = true;
  if (state === "running") {
    tabLightTimer = setInterval(() => { tabLightOn = !tabLightOn; applyTabLight(); }, 700);
  }
  applyTabLight();
}

function refreshDot(s) {
  const dot = s.el && s.el.querySelector(".dot");
  if (!dot) return;
  const cls = s.attention ? "attention"
    : s.running ? "running"
    : s.outcome === "failed" ? "failed"
    : "idle";
  dot.className = "dot " + cls;
}

function refreshTabLight() {
  const all = [...sessions.values()];
  all.forEach(refreshDot);      // 左栏小圆点按各自任务判定，不互相影响
  // 标签灯只看当前选中的任务：切到空闲任务时，别让上个任务的红灯继续亮着。
  const active = activeId ? sessions.get(activeId) : null;
  let next = null;
  if (active) {
    if (active.attention) next = "attention";
    else if (active.running) next = "running";
    else if (active.outcome === "failed") next = "failed";
  }
  setTabLight(next);
}

/* ── Right rail ── */
document.querySelectorAll("#rail .tab").forEach((tab) => {
  tab.onclick = () => {
    railTab = tab.dataset.tab;
    document.querySelectorAll("#rail .tab").forEach(t => t.classList.toggle("active", t === tab));
    renderRail();
  };
});

function renderRail() {
  const body = $("rail-body");

  // 价格是全局设置，不依赖具体会话
  if (railTab === "pricing") { renderPricing(); return; }

  const s = activeId ? sessions.get(activeId) : null;
  if (!s) { body.innerHTML = `<div class="rail-empty">未选择任务</div>`; return; }

  if (railTab === "files") { renderFiles(s); return; }

  if (railTab === "todo") {
    if (!s.todos.length) { body.innerHTML = `<div class="rail-empty">还没有任务清单</div>`; return; }
    body.innerHTML = s.todos.map(t => {
      const done = t.status === "completed";
      const active = t.status === "in_progress";
      const mark = done ? "✓" : active ? "▸" : "○";
      return `<div class="todo-item ${done ? "done" : active ? "active" : ""}">
        <span class="mark">${mark}</span><span>${escapeHtml(t.content)}</span></div>`;
    }).join("");
  } else {
    const total = s.stats.input + s.stats.output;
    body.innerHTML = `
      <div class="stat-row"><span>状态</span><span>${s.status}</span></div>
      <div class="stat-row"><span>累计轮次</span><span>${s.stats.rounds}</span></div>
      <div class="stat-row"><span>累计耗时</span><span>${fmtMs(s.stats.elapsed) || "—"}</span></div>
      <div class="stat-row"><span>输入 token</span><span>${fmtNum(s.stats.input)}</span></div>
      <div class="stat-row"><span>输出 token</span><span>${fmtNum(s.stats.output)}</span></div>
      <div class="stat-row"><span>合计 token</span><span>${fmtNum(total)}</span></div>
      <div class="stat-row"><span>最近一轮花费</span><span>${escapeHtml(s.stats.cost || "—")}</span></div>
      <div class="stat-row"><span>工作目录</span></div>
      <div class="rail-empty" style="word-break:break-all">${escapeHtml(s.workspace)}</div>`;
  }
}

/* ═══════════════════════════════════════════════════════════
   附件
     文件先 POST 到 /attach 落盘，再把路径随消息交给后端。Office/PDF
     不进请求体 —— 模型按路径用 office_read / office_render 去读，
     硬塞 base64 只会把上下文撑爆而且模型也解析不了。
   ═══════════════════════════════════════════════════════════ */
async function uploadAttachment(sessionId, file) {
  const fd = new FormData();
  fd.append("file", file);
  const r = await fetch(`/api/sessions/${sessionId}/attach`, { method: "POST", body: fd });
  if (!r.ok) {
    let msg = `上传失败（HTTP ${r.status}）`;
    try {
      const j = await r.json();
      if (j && j.detail) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail);
    } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

async function addFiles(sessionId, files) {
  const s = sessions.get(sessionId);
  if (!s || !files.length) return;
  s.uploading += files.length;
  renderAttachments(s);
  for (const file of files) {
    try {
      s.attachments.push(await uploadAttachment(sessionId, file));
    } catch (e) {
      const d = document.createElement("div");
      d.className = "m-err";
      d.textContent = `${file.name}：${e.message}`;
      s.inner.appendChild(d);
    } finally {
      s.uploading -= 1;
      renderAttachments(s);
    }
  }
}

function renderAttachments(s) {
  const bar = s.attachBar;
  if (!bar) return;
  const busy = s.uploading > 0
    ? [`<span class="att-chip busy">⏳ 上传中 ${s.uploading}</span>`] : [];
  const chips = s.attachments.map((a, i) => `
    <span class="att-chip" title="${escapeHtml(a.path || "")}">
      <span>${escapeHtml(a.icon || "📎")} ${escapeHtml(a.name)}</span>
      <button data-i="${i}" title="移除">×</button>
    </span>`);
  bar.innerHTML = busy.concat(chips).join("");
  bar.classList.toggle("show", bar.innerHTML.length > 0);
  bar.querySelectorAll("button[data-i]").forEach((btn) => {
    btn.onclick = () => {
      s.attachments.splice(Number(btn.dataset.i), 1);
      renderAttachments(s);
    };
  });
}

/* ═══════════════════════════════════════════════════════════
   Actions
   ═══════════════════════════════════════════════════════════ */
async function sendMessage(id) {
  const s = sessions.get(id);
  if (!s) return;
  const text = s.input.value.trim() || (s.attachments.length ? "请阅读这些附件并告诉我重点。" : "");
  if (!text) return;
  if (s.running) return;
  s.input.value = "";
  s.input.style.height = "auto";
  s.lastText = null;

  // 设置同步到后端（轮数上限、自动允许、模型）
  try {
    const rounds = parseInt(s.maxRounds.value, 10) || s.max_rounds;
    s.max_rounds = rounds;
    const maxTokens = parseInt(s.maxTokens.value, 10) || 0;
    s.max_tokens = maxTokens;
    await api(`/api/sessions/${id}/config`, {
      method: "POST",
      body: JSON.stringify({
        max_rounds: rounds,
        auto_allow: s.autoAllow.checked,
        provider: s.providerSel ? s.providerSel.value : "",
        model: s.modelSel ? s.modelSel.value : "",
        max_tokens: maxTokens,
      }),
    });
  } catch (e) {}

  const attachments = s.attachments.map(a => ({
    name: a.name, path: a.path, kind: a.kind, icon: a.icon, label: a.label,
  }));

  try {
    await api(`/api/sessions/${id}/messages`, {
      method: "POST",
      body: JSON.stringify({ text, attachments }),
    });
    // 发出去了才清空；失败要留着，不然用户得重新挂一遍
    s.attachments = [];
    renderAttachments(s);
  } catch (err) {
    const d = document.createElement("div");
    d.className = "m-err";
    d.textContent = err.message;
    s.inner.appendChild(d);
  }
}

$("stop").onclick = async () => {
  if (!activeId) return;
  try { await api(`/api/sessions/${activeId}/cancel`, { method: "POST" }); } catch (e) {}
};

$("new-session").onclick = () => createSession().catch(err => alert(err.message));

$("collapse").onclick = () => document.body.classList.toggle("collapsed");

/* ═══════════════════════════════════════════════════════════
   价格编辑器（单位：每千 token，即官方每百万价 ÷ 1000）
   ═══════════════════════════════════════════════════════════ */
async function renderPricing() {
  const body = $("rail-body");
  body.innerHTML = `<div class="rail-empty">加载中…</div>`;

  let info;
  try { info = await api("/api/pricing"); }
  catch (e) { body.innerHTML = `<div class="rail-empty">读取失败：${escapeHtml(e.message)}</div>`; return; }

  const cur = info.current || {};
  const p = cur.prices || {};
  const b = (info.builtin || {}).prices || {};
  const srcLabel = {
    exact: "精确匹配",
    prefix: "前缀匹配（估算）",
    provider_default: "provider 默认价（估算）",
    fallback: "兜底价（估算）",
  }[cur.source || ""] || "未匹配";

  // 一组价格渲染成三行；CNY 和 USD 两种口径都认
  const priceRows = (label, obj) => {
    const has = obj && (obj.input_cny !== undefined || obj.input_usd !== undefined);
    if (!has) {
      return `<div class="stat-row"><span>${label}</span><span>未匹配到</span></div>`;
    }
    const sym = obj.input_cny !== undefined ? "¥" : "$";
    const inp = obj.input_cny ?? obj.input_usd;
    const outp = obj.output_cny ?? obj.output_usd;
    const hit = obj.input_cache_hit_cny ?? obj.input_cache_hit_usd;
    return `<div class="stat-row"><span>${label} 输入 / 千 tok</span><span>${sym}${inp}</span></div>
      <div class="stat-row"><span>${label} 输出 / 千 tok</span><span>${sym}${outp}</span></div>
      <div class="stat-row"><span>${label} 缓存命中</span><span>${hit === undefined ? "按比例折算" : sym + hit}</span></div>`;
  };

  body.innerHTML = `
    <div class="stat-row"><span>当前模型</span><span>${escapeHtml(cur.model || "—")}</span></div>
    <div class="stat-row"><span>计价来源</span><span>${escapeHtml(srcLabel)}</span></div>
    ${priceRows("生效价", p)}
    ${priceRows("内置价", b)}
    <div class="rail-empty" style="word-break:break-all">已保存至：${escapeHtml(info.file || "")}</div>
    <div style="margin-top:12px;border-top:1px solid var(--border-soft);padding-top:10px">
      <div class="rail-empty" style="padding:0 0 6px">自己填价（每千 token = 官方每百万价 ÷ 1000）</div>
      <input class="p-input" data-k="provider" placeholder="provider，如 zhipu">
      <input class="p-input" data-k="model" placeholder="model，如 glm-4.7-flash">
      <input class="p-input" data-k="input_price" placeholder="输入价 / 千 tok，如 0.0001">
      <input class="p-input" data-k="output_price" placeholder="输出价 / 千 tok，如 0.0001">
      <input class="p-input" data-k="cached_price" placeholder="缓存命中价 / 千 tok（可留空）">
      <button id="p-fill">回填内置价</button>
      <button id="p-save">保存</button>
    </div>`;

  const field = (k) => (body.querySelector(`[data-k="${k}"]`) || {}).value || "";
  const setField = (k, v) => {
    const el = body.querySelector(`[data-k="${k}"]`);
    if (el && v !== undefined && v !== null) el.value = v;
  };
  // 方便用户：默认填上当前 provider/model
  setField("provider", cur.provider);
  setField("model", cur.model);

  // 读一个价格输入：负数/非数字直接拒，明显填成"每百万价"的先确认
  const readPrice = (k, label) => {
    const raw = field(k).trim();
    if (!raw) return NaN;
    const v = Number(raw);
    if (!isFinite(v) || v < 0) {
      alert(`${label} 要填一个 ≥ 0 的数字`);
      return NaN;
    }
    // 内置表里最贵的也就 0.1/千 tok（= ¥100/百万），填到 0.5 以上基本是照抄了官方价
    if (v >= 0.5) {
      const ok = confirm(
        `${label} 填的是 ${v}。\n\n这里的单位是「每千 token」，官方价要先除以 1000` +
        `（例：官方 0.1/百万 → 这里填 0.0001）。\n\n确定按 ${v} 保存吗？`
      );
      if (!ok) return NaN;
    }
    return v;
  };

  body.querySelector("#p-fill").onclick = () => {
    if (!b || (b.input_cny === undefined && b.input_usd === undefined)) {
      alert("内置表里没有这个模型，只能手填。");
      return;
    }
    if (cur.provider) setField("provider", cur.provider);
    if (cur.model) setField("model", cur.model);
    setField("input_price", b.input_cny ?? b.input_usd);
    setField("output_price", b.output_cny ?? b.output_usd);
    setField("cached_price", b.input_cache_hit_cny ?? b.input_cache_hit_usd ?? "");
  };

  body.querySelector("#p-save").onclick = async () => {
    const provider = field("provider").trim();
    const model = field("model").trim();
    if (!provider || !model) { alert("provider / model 都要填"); return; }

    const input_price = readPrice("input_price", "输入价");
    if (Number.isNaN(input_price)) return;
    const output_price = readPrice("output_price", "输出价");
    if (Number.isNaN(output_price)) return;

    const payload = { provider, model, input_price, output_price };
    if (field("cached_price").trim()) {
      const cached_price = readPrice("cached_price", "缓存命中价");
      if (Number.isNaN(cached_price)) return;
      if (cached_price > input_price
          && !confirm("缓存命中价高于输入价，通常是填反了。仍要保存吗？")) return;
      payload.cached_price = cached_price;
    }

    try {
      await api("/api/pricing", { method: "POST", body: JSON.stringify(payload) });
      renderPricing();
    } catch (e) {
      alert("保存失败：" + e.message);
    }
  };
}

/* ═══════════════════════════════════════════════════════════
   Modal
   ═══════════════════════════════════════════════════════════ */
let modalResolve = null;
function askModal(sessionId, title, text, needsInput) {
  $("modal-title").textContent = title;
  $("modal-text").textContent = text || "";
  $("modal-input").style.display = needsInput ? "block" : "none";
  $("modal-input").value = "";
  $("modal-ok").textContent = needsInput ? "提交" : "允许";
  $("modal-cancel").style.display = needsInput ? "none" : "inline-block";
  $("modal-always").style.display = needsInput ? "none" : "inline-block";
  $("modal").classList.add("show");
  (needsInput ? $("modal-input") : $("modal-ok")).focus();
  modalResolve = async (ok, remember) => {
    $("modal").classList.remove("show");
    try {
      await api(`/api/sessions/${sessionId}/reply`, {
        method: "POST",
        body: JSON.stringify({
          value: $("modal-input").value, allow: ok, remember: !!remember,
        }),
      });
    } catch (e) {}
    // 答完了就别再亮黄灯（后端也会清 pending，这里让灯立刻变）
    const s = sessions.get(sessionId);
    if (s) { s.attention = false; refreshTabLight(); }
  };
}
$("modal-ok").onclick = () => modalResolve && modalResolve(true);
$("modal-always").onclick = () => modalResolve && modalResolve(true, true);
$("modal-cancel").onclick = () => modalResolve && modalResolve(false);
$("modal-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); modalResolve && modalResolve(true); }
});

/* ═══════════════════════════════════════════════════════════
   Boot: restore server-side sessions
   ═══════════════════════════════════════════════════════════ */
(async function boot() {
  try { MODEL_INFO = await api("/api/models"); } catch (e) {}
  try {
    const { sessions: list } = await api("/api/sessions");
    for (const s of list) mountSession(s);
    if (list.length) selectSession(list[0].id);
  } catch (e) {}
  refreshHistory();
  refreshTabLight();   // 刷新前就在跑 / 就在等确认的任务，灯要接着亮
})();
</script>
