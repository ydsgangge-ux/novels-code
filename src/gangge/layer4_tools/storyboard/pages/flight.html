}

body.capture #ui{display:none}

</style></head>

if(!C.progress)prog.style.display='none';
const voices=D.filter(o=>o.voice),mus=C.music?Object.assign({volume:.35,fadeIn:2,fadeOut:3},C.music):null;
const probe=o=>new Promise(r=>{if(o.voice.duration){r();return}const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>{o.voice.duration=a.duration;r()};a.onerror=()=>r();a.src=o.voice.src});
const pre=s=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=s});
voices.forEach(o=>o.voice.el=new Audio(o.voice.src));if(mus){mus.el=new Audio(mus.src);mus.el.loop=true}
let time=0,playing=!CAPTURE&&!voices.length&&!mus,last=performance.now(),dirty=true;const pp=$('#pp');pp.textContent=playing?'暂停':'播放';
let winT=0,winN=0,cool=0; /* 自适应画质的采样窗口 */
window.READY=Promise.all([...voices.map(probe),...D.flatMap(o=>o.photos.filter(p=>p.src).map(p=>pre(p.src)))]).then(()=>{build();dirty=true});
window.getAudio=()=>({voices:D.map((o,k)=>o.voice&&{src:o.voice.src,start:S[k].d0+.5,dur:o.voice.duration||0,volume:o.voice.volume??1}).filter(Boolean),music:mus&&{src:mus.src,volume:mus.volume,fadeIn:mus.fadeIn,fadeOut:mus.fadeOut}});
function audioSync(){const act=playing&&!CAPTURE;
 D.forEach((o,k)=>{const v=o.voice;if(!v)return;const st=S[k].d0+.5,inn=act&&time>=st&&time<st+(v.duration||0);
  if(inn){const want=time-st;if(v.el.paused||Math.abs(v.el.currentTime-want)>.35){v.el.currentTime=want;v.el.volume=v.volume??1;v.el.play().catch(()=>{})}}else if(!v.el.paused)v.el.pause()});
 if(mus){if(act){mus.el.volume=clamp(mus.volume*Math.min(1,time/mus.fadeIn,(TOTAL-time)/mus.fadeOut),0,1);if(mus.el.paused)mus.el.play().catch(()=>{})}else if(!mus.el.paused)mus.el.pause()}}
function toggle(){if(time>=TOTAL-.01){time=0;playing=true}else playing=!playing;pp.textContent=playing?'暂停':'播放';dirty=true}
pp.onclick=toggle;sc.oninput=()=>{time=+sc.value;dirty=true};addEventListener('resize',()=>dirty=true);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}
 else if(e.code==='ArrowRight'){const s=S.find(s=>s.d0-T.ramp>time+.2);if(s){time=s.d0;dirty=true}}
 else if(e.code==='ArrowLeft'){const s=[...S].reverse().find(s=>s.d0<time-1.5);time=s?s.d0:0;dirty=true}});
/* 关键：原来把 dt 截到 .05s，机器一慢（比如软件渲染 100ms 一帧），时间就只走
   50ms —— 画面变成慢动作，配音还会和画面错开。现在按真实经过时间走；只有切走
   标签页再回来那种 >1s 的跳帧才丢弃。掉帧只是帧率低，节奏仍然是 1 倍速。 */
function loop(now){const raw=(now-last)/1000;last=now;const dt=raw>1?0:raw;
 if(playing){time+=dt;dirty=true;if(time>=TOTAL){time=TOTAL;playing=false;pp.textContent='重播'}}
 /* 逐帧拍摄（?capture=1）时 playing=false，但 rAF 必须继续重绘：Chromium 只在
    合成时把 WebGL canvas 交给截图，循环一停，截图拿到的是没画过的白底。
    time 由 __seek 独占，这里只是把同一帧再画一次，不会让画面跑偏。 */
 if(CAPTURE)dirty=true;
 if(dirty){dirty=false;frameAt(time);audioSync()}
 if(!CAPTURE&&dt>0){winT+=dt;winN++;
  /* 按时间开窗而不是按帧数：4fps 的机器等 20 帧要 5 秒，太迟了 */
  if(winT>=.7&&winN>=3){const avg=winT/winN;winT=0;winN=0;
   if(avg>.1&&!shadowsOff){shadowsOff=true;renderer.shadowMap.enabled=false;setQ(.75);cool=12}
   else if(avg>.042&&q>QMIN){setQ(q-.1);cool=6}        /* 慢于 24fps：降像素 */
   else if(avg<.023&&q<QMAX&&cool<=0){setQ(q+.1)}      /* 快于 43fps：升回去 */
   if(cool>0)cool--}}
 requestAnimationFrame(loop)}
/* 给逐帧渲染脚本用的接口 */
window.seek=t=>{time=clamp(t,0,TOTAL);frameAt(time)};window.getTotal=()=>TOTAL;
/* 逐帧渲染器的三个钩子（renderer.py）：只留画面，播放器控件绝不进帧 */
window.__seek=window.seek;window.__ready=()=>window.READY;
window.__hide_ui=()=>{document.body.classList.add('capture');$('#ui').style.display='none';$('#prog').style.display='none';$('#wm').style.display='none'};
requestAnimationFrame(loop);
})();
</script>
</body></html>
