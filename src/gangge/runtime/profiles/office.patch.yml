- patch:
    - id: tools
      config:
        office: true          # 注册 office_info / office_read / office_check
        profile: 'office'     # 工具面直接包含它们，不需要 tool_search
        browser: false        # 处理文档用不上浏览器
        comfyui: false
        novel: false

    - id: memory-bank
      config:
        dir: '.gangge'
        progress_file: progress.md
        changelog_file: changelog.md
        decisions_file: decisions.md
        auto_save: true
