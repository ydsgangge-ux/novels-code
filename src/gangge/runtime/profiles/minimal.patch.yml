# minimal 的 profile 层补丁：整条 config 替换，不做 merge。
- patch:
    - id: tools
      config:
        load_plugins: false
        browser: false
        comfyui: false
        novel: false
        profile: 'coding'

    - id: telemetry
      config:
        sink: ''
        path: '.gangge/telemetry.jsonl'

- remove:
    - memory-bank
